<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubre el Perú</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Descubre el Perú</h1>
        <p>Conoce las maravillas de nuestro país</p>
    </header>

    <main>
        <section class="tarjeta">

            <img
                src="https://images.unsplash.com/photo-1526392060635-9d6019884377?w=1200"
                alt="Machu Picchu en Cusco"
            >

            <div class="contenido">
                <h2>Machu Picchu - Cusco</h2>

                <p>
                    Machu Picchu es uno de los destinos
                    turísticos más importantes del Perú.
                    Esta ciudadela inca destaca por su
                    arquitectura, historia y paisajes.
                </p>

                <button onclick="alert('¡Bienvenido al Perú!')">
                    Explorar destino
                </button>
            </div>

        </section>
    </main>

    <footer>
        <p>Mi primera página web con Docker Compose</p>
    </footer>

</body>
</html>
